openapi: 3.0.3
info:
  title: dextro
  version: 0.1.0
  description: >
    Self-hosted file storage gateway. Paths in this file are written in full.
    Application endpoints live under /api/v1; /health sits at the root so
    container checks do not depend on the API version. Every operation needs a
    session unless it opts out with `security: []`, and everything under
    /api/v1/admin also needs the admin role.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the server can reach its database
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The server is running but a dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      summary: Report which sign-in options this instance offers
      tags: [auth]
      security: []
      responses:
        "200":
          description: The available options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Create an account with an email and password, and sign in
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The account was created and a session cookie was set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with an email and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in; a session cookie was set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: The session has ended and its cookie was cleared.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Return the signed-in user
      tags: [auth]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: Change the password and end every other session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
      responses:
        "204":
          description: The password was changed.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List the signed-in user's active sessions
      tags: [auth]
      responses:
        "200":
          description: Active sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: End one of the signed-in user's sessions
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session has ended.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/google/start:
    get:
      operationId: startGoogleSignIn
      summary: Redirect the browser to Google to sign in
      tags: [auth]
      security: []
      responses:
        "302":
          description: Redirects to Google.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/google/link:
    post:
      operationId: linkGoogle
      summary: Start linking a Google account to the signed-in user
      description: >
        A POST rather than a redirect so it passes the Origin check. The client
        sends the browser to the returned URL.
      tags: [auth]
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleRedirect"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/google/callback:
    get:
      operationId: googleCallback
      summary: Finish a Google sign-in or link
      description: >
        Always redirects into the UI. Failures carry a stable code in the
        `error` query parameter of the redirect.
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirects into the UI.
  /api/v1/auth/api-keys:
    get:
      operationId: listAPIKeys
      summary: List the signed-in user's API keys
      tags: [auth]
      responses:
        "200":
          description: The user's keys, newest first. Secrets are never included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAPIKey
      summary: Create an API key
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyInput"
      responses:
        "201":
          description: The key. Its secret appears here once and is never shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/api-keys/{id}:
    delete:
      operationId: revokeAPIKey
      summary: Revoke one of the signed-in user's API keys
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The key no longer works.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files:
    get:
      operationId: listFolder
      summary: List a folder, or the top level if none is given
      tags: [files]
      parameters:
        - name: folder_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: What's in the folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderContents"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: uploadFile
      summary: Upload a file
      description: >
        The request body is the file itself, not a form, so it can stream to the
        storage account. The body's Content-Type is stored as the file's type.
      tags: [files]
      parameters:
        - name: connection_id
          in: query
          description: Required. Not marked so, because generated checks would run before access checks.
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          description: Required, as for connection_id.
          schema:
            type: string
        - name: folder_id
          in: query
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The file is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}:
    get:
      operationId: getFile
      summary: Return a file's details
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The file's details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: renameFile
      summary: Rename a file
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "200":
          description: The renamed file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteFile
      summary: Permanently delete a file that's in the trash
      description: Removes it from the storage account too. API keys can't do this.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The file is gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/content:
    get:
      operationId: downloadFile
      summary: Stream a file's content
      description: >
        Supports single-range requests. Only images, video and PDF can be shown
        inline; everything else downloads whatever is asked for.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: disposition
          in: query
          schema:
            type: string
            enum: [inline, attachment]
      responses:
        "200":
          description: The whole file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/move:
    post:
      operationId: moveFile
      summary: Move a file to another folder
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFileInput"
      responses:
        "200":
          description: The moved file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/trash:
    post:
      operationId: trashFile
      summary: Move a file to the trash
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The file is in the trash.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/restore:
    post:
      operationId: restoreFile
      summary: Take a file out of the trash
      description: It returns to its folder, or to the top level if that folder is in the trash.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The file is back.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders:
    post:
      operationId: createFolder
      summary: Create a folder
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
      responses:
        "201":
          description: The new folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders/{id}:
    patch:
      operationId: renameFolder
      summary: Rename a folder
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "200":
          description: The renamed folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteFolder
      summary: Permanently delete a folder that's in the trash, and everything in it
      description: Removes its files from their storage accounts too. API keys can't do this.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The folder is gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders/{id}/move:
    post:
      operationId: moveFolder
      summary: Move a folder into another folder
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFolderInput"
      responses:
        "200":
          description: The moved folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders/{id}/trash:
    post:
      operationId: trashFolder
      summary: Move a folder and everything in it to the trash
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The folder is in the trash.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders/{id}/restore:
    post:
      operationId: restoreFolder
      summary: Take a folder out of the trash
      description: It returns to its parent, or to the top level if that's in the trash.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The folder is back.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/trash:
    get:
      operationId: listTrash
      summary: List what's in the trash
      tags: [files]
      responses:
        "200":
          description: Trashed items. A trashed folder's contents aren't listed separately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trash"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: emptyTrash
      summary: Permanently delete everything in the trash
      description: API keys can't do this.
      tags: [files]
      responses:
        "204":
          description: The trash is empty.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/settings:
    get:
      operationId: getSettings
      summary: Return the instance-wide settings
      tags: [admin]
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      summary: Change instance-wide settings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/connections:
    get:
      operationId: listConnections
      summary: List the signed-in user's storage connections
      tags: [storage]
      responses:
        "200":
          description: The user's connections, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/connections/{id}:
    delete:
      operationId: deleteConnection
      summary: Remove a connection and forget its credentials
      description: Files already in the account stay there.
      tags: [storage]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The connection is gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/connections/{id}/test:
    post:
      operationId: testConnection
      summary: Check that a connection still works
      tags: [storage]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The connection works.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/google/connect:
    post:
      operationId: connectGoogleDrive
      summary: Start connecting a Google Drive account
      description: >
        A POST rather than a redirect so it passes the Origin check. The client
        sends the browser to the returned URL.
      tags: [storage]
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleRedirect"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/google/callback:
    get:
      operationId: googleDriveCallback
      summary: Finish connecting a Google Drive account
      description: >
        Always redirects into the UI. Failures carry a stable code in the
        `error` query parameter of the redirect.
      tags: [storage]
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirects into the UI.
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dextro_session
    apiKey:
      type: http
      scheme: bearer
      description: Reaches file routes only. Permanent deletes need a session.
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    AuthConfig:
      type: object
      required: [registration_open, google_enabled]
      properties:
        registration_open:
          type: boolean
          description: Whether a new account can be created right now.
        google_enabled:
          type: boolean
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    ChangePassword:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
    User:
      type: object
      required: [id, email, role, has_password, google_linked, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
        has_password:
          type: boolean
          description: False for accounts created through Google.
        google_linked:
          type: boolean
        created_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [id, current, user_agent, ip, created_at, last_seen_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
          description: True for the session making this request.
        user_agent:
          type: string
        ip:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Connection:
      type: object
      description: A storage account. Credentials are never included.
      required: [id, name, provider, summary, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
          enum: [google_drive]
        summary:
          type: string
          description: What the connection points at, for showing to its owner.
        created_at:
          type: string
          format: date-time
    GoogleRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
    File:
      type: object
      required: [id, name, size, content_type, preview, connection_id, folder_id, trashed_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        size:
          type: integer
          format: int64
        content_type:
          type: string
        preview:
          type: string
          enum: [image, video, pdf, none]
          description: How the file can be shown inline, if at all.
        connection_id:
          type: string
          format: uuid
        folder_id:
          type: string
          format: uuid
          nullable: true
        trashed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Folder:
      type: object
      required: [id, name, parent_id, trashed_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        trashed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FolderContents:
      type: object
      required: [path, folders, files]
      properties:
        path:
          type: array
          description: The folders from the top level down to this one.
          items:
            $ref: "#/components/schemas/Folder"
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
    Trash:
      type: object
      required: [folders, files]
      properties:
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
    NameInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
    FolderInput:
      type: object
      required: [name, parent_id]
      properties:
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
    MoveFileInput:
      type: object
      required: [folder_id]
      properties:
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: Null moves it to the top level.
    MoveFolderInput:
      type: object
      required: [parent_id]
      properties:
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Null moves it to the top level.
    APIKey:
      type: object
      required: [id, name, prefix, scopes, created_at, last_used_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The start of the key, for telling keys apart.
        scopes:
          type: array
          items:
            type: string
            enum: ["files:read", "files:write"]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
    APIKeyInput:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: ["files:read", "files:write"]
    APIKeyCreated:
      type: object
      required: [key, token]
      properties:
        key:
          $ref: "#/components/schemas/APIKey"
        token:
          type: string
          description: The secret, sent as a bearer token. Shown only this once.
    Settings:
      type: object
      required: [allow_registration, max_upload_bytes]
      properties:
        allow_registration:
          type: boolean
          description: >
            When false, nobody can create an account, by password or through a
            first-time Google sign-in. The first account on an empty instance
            can always be created.
        max_upload_bytes:
          type: integer
          format: int64
          description: The largest file anyone can upload.
    SettingsUpdate:
      type: object
      description: Only the fields present are changed.
      properties:
        allow_registration:
          type: boolean
        max_upload_bytes:
          type: integer
          format: int64
    Error:
      type: object
      description: Body of every error response.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
            message:
              type: string
              description: Safe, human-readable message.
            request_id:
              type: string
              description: Matches the X-Request-ID response header and the server logs.
