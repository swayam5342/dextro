openapi: 3.0.3
info:
  title: dextro
  version: 0.1.0
  description: >
    Self-hosted file storage gateway. Paths in this file are written in full.
    Application endpoints live under /api/v1; /health sits at the root so
    container checks do not depend on the API version. Every operation needs a
    session unless it opts out with `security: []`, and everything under
    /api/v1/admin also needs the admin role.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the server can reach its database
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The server is running but a dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      summary: Report which sign-in options this instance offers
      tags: [auth]
      security: []
      responses:
        "200":
          description: The available options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Create an account with an email and password, and sign in
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The account was created and a session cookie was set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with an email and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in; a session cookie was set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: The session has ended and its cookie was cleared.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Return the signed-in user
      tags: [auth]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: Change the password and end every other session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
      responses:
        "204":
          description: The password was changed.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List the signed-in user's active sessions
      tags: [auth]
      responses:
        "200":
          description: Active sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: End one of the signed-in user's sessions
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session has ended.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/google/start:
    get:
      operationId: startGoogleSignIn
      summary: Redirect the browser to Google to sign in
      tags: [auth]
      security: []
      responses:
        "302":
          description: Redirects to Google.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/google/link:
    post:
      operationId: linkGoogle
      summary: Start linking a Google account to the signed-in user
      description: >
        A POST rather than a redirect so it passes the Origin check. The client
        sends the browser to the returned URL.
      tags: [auth]
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleRedirect"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/google/callback:
    get:
      operationId: googleCallback
      summary: Finish a Google sign-in or link
      description: >
        Always redirects into the UI. Failures carry a stable code in the
        `error` query parameter of the redirect.
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirects into the UI.
  /api/v1/auth/api-keys:
    get:
      operationId: listAPIKeys
      summary: List the signed-in user's API keys
      tags: [auth]
      responses:
        "200":
          description: The user's keys, newest first. Secrets are never included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAPIKey
      summary: Create an API key
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyInput"
      responses:
        "201":
          description: The key. Its secret appears here once and is never shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/api-keys/{id}:
    delete:
      operationId: revokeAPIKey
      summary: Revoke one of the signed-in user's API keys
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The key no longer works.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files:
    get:
      operationId: listFolder
      summary: List a folder, or the top level if none is given
      tags: [files]
      parameters:
        - name: folder_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: What's in the folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderContents"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: uploadFile
      summary: Upload a file
      description: >
        The request body is the file itself, not a form, so it can stream to the
        storage account. The body's Content-Type is stored as the file's type.
      tags: [files]
      parameters:
        - name: connection_id
          in: query
          description: The account to use. Left out, the account with the most free space is chosen.
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          description: Required. Not marked so, because generated checks would run before access checks.
          schema:
            type: string
        - name: folder_id
          in: query
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The file is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}:
    get:
      operationId: getFile
      summary: Return a file's details
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The file's details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: renameFile
      summary: Rename a file
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "200":
          description: The renamed file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteFile
      summary: Permanently delete a file that's in the trash
      description: Removes it from the storage account too. API keys can't do this.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The file is gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/content:
    get:
      operationId: downloadFile
      summary: Stream a file's content
      description: >
        Supports single-range requests. Only images, video and PDF can be shown
        inline; everything else downloads whatever is asked for.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: disposition
          in: query
          schema:
            type: string
            enum: [inline, attachment]
      responses:
        "200":
          description: The whole file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/thumbnail:
    get:
      operationId: getThumbnail
      summary: Return a small preview image of a file
      description: Not every file has one, and Google can take a moment to make one after an upload.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The image.
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/move:
    post:
      operationId: moveFile
      summary: Move a file to another folder
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFileInput"
      responses:
        "200":
          description: The moved file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/trash:
    post:
      operationId: trashFile
      summary: Move a file to the trash
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The file is in the trash.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/restore:
    post:
      operationId: restoreFile
      summary: Take a file out of the trash
      description: It returns to its folder, or to the top level if that folder is in the trash.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The file is back.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders:
    post:
      operationId: createFolder
      summary: Create a folder
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
      responses:
        "201":
          description: The new folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders/{id}:
    patch:
      operationId: renameFolder
      summary: Rename a folder
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "200":
          description: The renamed folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteFolder
      summary: Permanently delete a folder that's in the trash, and everything in it
      description: Removes its files from their storage accounts too. API keys can't do this.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The folder is gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders/{id}/move:
    post:
      operationId: moveFolder
      summary: Move a folder into another folder
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFolderInput"
      responses:
        "200":
          description: The moved folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders/{id}/trash:
    post:
      operationId: trashFolder
      summary: Move a folder and everything in it to the trash
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The folder is in the trash.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/folders/{id}/restore:
    post:
      operationId: restoreFolder
      summary: Take a folder out of the trash
      description: It returns to its parent, or to the top level if that's in the trash.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The folder is back.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/trash:
    get:
      operationId: listTrash
      summary: List what's in the trash
      tags: [files]
      responses:
        "200":
          description: Trashed items. A trashed folder's contents aren't listed separately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trash"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: emptyTrash
      summary: Permanently delete everything in the trash
      description: API keys can't do this.
      tags: [files]
      responses:
        "204":
          description: The trash is empty.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/pool:
    get:
      operationId: getPool
      summary: Report how full each linked account is, and the total
      description: Slower than listing connections, because it asks Google about every account.
      tags: [storage]
      responses:
        "200":
          description: The pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pool"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/search:
    get:
      operationId: search
      summary: Find files and folders by name
      description: Trashed items, and anything inside a trashed folder, aren't included.
      tags: [files]
      parameters:
        - name: q
          in: query
          description: Required. Not marked so, because generated checks would run before access checks.
          schema:
            type: string
      responses:
        "200":
          description: What matched, up to 100 of each.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/settings:
    get:
      operationId: getSettings
      summary: Return the instance-wide settings
      tags: [admin]
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      summary: Change instance-wide settings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List every account on the server
      tags: [admin]
      responses:
        "200":
          description: Every account, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedUser"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create an account with a password the user must replace
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The new account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/users/{id}:
    delete:
      operationId: deleteUser
      summary: Delete an account and dextro's records of its files
      description: The files themselves stay in that person's Google Drive.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The account is gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: Set a password the user must replace, and sign them out everywhere
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPassword"
      responses:
        "204":
          description: The password was set.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/status:
    get:
      operationId: getServerStatus
      summary: Report on background jobs and linked accounts across the server
      tags: [admin]
      responses:
        "200":
          description: What the background jobs last saw.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatus"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/audit:
    get:
      operationId: listAuditEvents
      summary: List security-relevant events, newest first
      tags: [admin]
      parameters:
        - name: action
          in: query
          description: Only events with this action.
          schema:
            type: string
        - name: before
          in: query
          description: >
            The next_before of the previous page. A string, because the generated
            code rejects a bad number before the access checks run.
          schema:
            type: string
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/transfers:
    get:
      operationId: listTransfers
      summary: See files moving between accounts
      tags: [files]
      responses:
        "200":
          description: What's waiting, what failed, and what each account holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferQueue"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTransfers
      summary: Move files to another account
      description: >
        Files move in the background, one at a time. Each is copied, checked against
        the original, and only then removed from its old account. The space is held
        on the target from now on. Files added from Drive can't move.
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTransfers"
      responses:
        "200":
          description: How many files were queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/transfers/retry:
    post:
      operationId: retryTransfers
      summary: Try every failed move again
      tags: [files]
      responses:
        "204":
          description: They're waiting again.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/transfers/{id}:
    delete:
      operationId: deleteTransfer
      summary: Cancel a move, or clear one that failed
      description: The file stays where it is. A copy in progress is thrown away.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: It's gone from the queue.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/connections/{id}/empty:
    post:
      operationId: emptyConnection
      summary: Move everything out of an account
      description: >
        Queues every file in the account, the trash included, across the user's other
        accounts, and keeps new files out of it. It's refused if they won't all fit.
        Files added from Drive stay, and are counted in skipped.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: How many files were queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: stopEmptyingConnection
      summary: Stop emptying an account and use it again
      description: Files already moved stay moved.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The account is back in use.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/zip:
    get:
      operationId: downloadZip
      summary: Download files and folders as one zip
      description: >
        The zip streams as it's made, so a failure partway through cuts the
        connection rather than ending the download normally. IDs are plain strings
        because the generated code would reject a bad one before the access checks.
      tags: [files]
      parameters:
        - name: file
          in: query
          description: IDs of files to include.
          schema:
            type: array
            items:
              type: string
        - name: folder
          in: query
          description: IDs of folders to include, with everything inside them.
          schema:
            type: array
            items:
              type: string
        - name: check
          in: query
          description: >
            Set to true to find out whether this zip can be made, without making it.
            A refused download gives the browser nothing useful to show, so the app
            asks first.
          schema:
            type: string
      responses:
        "200":
          description: The zip.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "204":
          description: The zip can be made.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/uploads:
    get:
      operationId: listUploads
      summary: List the signed-in user's unfinished uploads
      tags: [files]
      responses:
        "200":
          description: Unfinished uploads, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadSession"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: beginUpload
      summary: Start an upload sent in chunks
      description: >
        This chooses an account and holds the file's size on it until the upload
        finishes or is cancelled. An empty file has nothing to resume, so it goes
        through uploadFile instead. API keys use uploadFile too.
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUpload"
      responses:
        "201":
          description: The upload is ready for its first chunk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/uploads/{id}:
    get:
      operationId: getUpload
      summary: Ask the storage account how far an upload has really got
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The upload's progress. It has finished if file is present.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: cancelUpload
      summary: Abandon an upload and give back the space it held
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: The upload is gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/uploads/{id}/chunk:
    put:
      operationId: putUploadChunk
      summary: Send the next piece of an upload
      description: >
        The body is the bytes themselves. Every chunk but the last must be a
        multiple of 256 KiB. The answer's received says how much the storage
        account kept, which can be less than was sent and is where the next chunk
        has to start.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: offset
          in: query
          description: >
            Required. Where this chunk starts. A string, and not marked required,
            because generated checks would run before access checks.
          schema:
            type: string
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The upload's progress. It has finished if file is present.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/connections:
    get:
      operationId: listConnections
      summary: List the signed-in user's storage connections
      tags: [storage]
      responses:
        "200":
          description: The user's connections, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/connections/{id}:
    delete:
      operationId: deleteConnection
      summary: Remove a connection and forget its credentials
      description: Files already in the account stay there.
      tags: [storage]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The connection is gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/connections/{id}/sync:
    post:
      operationId: syncConnection
      summary: Make dextro match what's really in an account
      description: >
        Files in dextro's folder that dextro has no record of are added, and
        records of files that are gone are removed. Files added back go to the
        top level, because folders exist only in dextro.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: What changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/connections/{id}/picker:
    post:
      operationId: openPicker
      summary: Get what Google's picker needs to run in the browser
      description: >
        The access token is short-lived and limited to drive.file, and only the
        popup that runs the picker should hold it. API keys can't use this.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: What the picker needs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickerAccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/connections/{id}/import:
    post:
      operationId: importPicked
      summary: Add files chosen in Google's picker
      description: >
        The files stay where they are in Drive, and deleting them forever only
        removes them from dextro.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickedFiles"
      responses:
        "200":
          description: What happened to the files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/connections/{id}/test:
    post:
      operationId: testConnection
      summary: Check that a connection still works
      tags: [storage]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The connection works.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/google/connect:
    post:
      operationId: connectGoogleDrive
      summary: Start connecting a Google Drive account
      description: >
        A POST rather than a redirect so it passes the Origin check. The client
        sends the browser to the returned URL.
      tags: [storage]
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleRedirect"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage/google/callback:
    get:
      operationId: googleDriveCallback
      summary: Finish connecting a Google Drive account
      description: >
        Always redirects into the UI. Failures carry a stable code in the
        `error` query parameter of the redirect.
      tags: [storage]
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirects into the UI.
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dextro_session
    apiKey:
      type: http
      scheme: bearer
      description: Reaches file routes only. Permanent deletes need a session.
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    AuthConfig:
      type: object
      required: [registration_open, google_enabled]
      properties:
        registration_open:
          type: boolean
          description: True only on an empty server, where the first account becomes the admin.
        google_enabled:
          type: boolean
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    ChangePassword:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
    User:
      type: object
      required: [id, email, role, has_password, google_linked, must_change_password, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
        has_password:
          type: boolean
          description: False for accounts created through Google.
        google_linked:
          type: boolean
        must_change_password:
          type: boolean
          description: >
            The admin chose this password, so nothing else works until the
            user replaces it.
        created_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [id, current, user_agent, ip, created_at, last_seen_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
          description: True for the session making this request.
        user_agent:
          type: string
        ip:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Connection:
      type: object
      description: A storage account. Credentials are never included.
      required: [id, name, provider, summary, created_at, draining]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
          enum: [google_drive]
        summary:
          type: string
          description: What the connection points at, for showing to its owner.
        created_at:
          type: string
          format: date-time
        draining:
          type: boolean
          description: Being emptied, so new files stay out of it.
    Transfer:
      type: object
      description: A file moving between accounts.
      required: [id, file_id, name, size, copied, source_connection_id, target_connection_id, status]
      properties:
        id:
          type: string
          format: uuid
        file_id:
          type: string
          format: uuid
        name:
          type: string
        size:
          type: integer
          format: int64
        copied:
          type: integer
          format: int64
        source_connection_id:
          type: string
          format: uuid
        target_connection_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [waiting, failed]
        failure:
          type: string
          description: Why it failed, safe to show.
    AccountFiles:
      type: object
      required: [connection_id, files, external_files]
      properties:
        connection_id:
          type: string
          format: uuid
        files:
          type: integer
          description: Files that can move, including any in the trash.
        external_files:
          type: integer
          description: Files added from Drive, which stay where they are.
    TransferQueue:
      type: object
      required: [transfers, waiting, waiting_bytes, failed, removing, accounts]
      properties:
        transfers:
          type: array
          description: The first hundred, waiting ones first.
          items:
            $ref: "#/components/schemas/Transfer"
        waiting:
          type: integer
        waiting_bytes:
          type: integer
          format: int64
        failed:
          type: integer
        removing:
          type: integer
          description: Old copies of moved files still to be removed from their accounts.
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountFiles"
    NewTransfers:
      type: object
      required: [file_ids, target_connection_id]
      properties:
        file_ids:
          type: array
          items:
            type: string
            format: uuid
        target_connection_id:
          type: string
          format: uuid
    TransferResult:
      type: object
      required: [queued, skipped]
      properties:
        queued:
          type: integer
        skipped:
          type: integer
          description: Files that stay where they are.
    GoogleRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
    File:
      type: object
      required: [id, name, size, content_type, preview, connection_id, folder_id, trashed_at, created_at, updated_at, external]
      properties:
        external:
          type: boolean
          description: Someone's own Drive file, which deleting forever leaves in Drive.
        id:
          type: string
          format: uuid
        name:
          type: string
        size:
          type: integer
          format: int64
        content_type:
          type: string
        preview:
          type: string
          enum: [image, video, pdf, none]
          description: How the file can be shown inline, if at all.
        connection_id:
          type: string
          format: uuid
        folder_id:
          type: string
          format: uuid
          nullable: true
        trashed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Folder:
      type: object
      required: [id, name, parent_id, trashed_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        trashed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FolderContents:
      type: object
      required: [path, folders, files]
      properties:
        path:
          type: array
          description: The folders from the top level down to this one.
          items:
            $ref: "#/components/schemas/Folder"
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
    Trash:
      type: object
      required: [folders, files]
      properties:
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
    NameInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
    FolderInput:
      type: object
      required: [name, parent_id]
      properties:
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
    MoveFileInput:
      type: object
      required: [folder_id]
      properties:
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: Null moves it to the top level.
    MoveFolderInput:
      type: object
      required: [parent_id]
      properties:
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Null moves it to the top level.
    APIKey:
      type: object
      required: [id, name, prefix, scopes, created_at, last_used_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The start of the key, for telling keys apart.
        scopes:
          type: array
          items:
            type: string
            enum: ["files:read", "files:write"]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
    APIKeyInput:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: ["files:read", "files:write"]
    APIKeyCreated:
      type: object
      required: [key, token]
      properties:
        key:
          $ref: "#/components/schemas/APIKey"
        token:
          type: string
          description: The secret, sent as a bearer token. Shown only this once.
    PoolAccount:
      type: object
      required: [connection, available, used_bytes, reserved_bytes, limit_bytes]
      properties:
        connection:
          $ref: "#/components/schemas/Connection"
        available:
          type: boolean
          description: False if the account can't be reached, usually because its token expired.
        used_bytes:
          type: integer
          format: int64
        reserved_bytes:
          type: integer
          format: int64
          description: Space held by uploads that haven't finished yet.
        limit_bytes:
          type: integer
          format: int64
          nullable: true
          description: Null if the account has no limit, or can't be reached.
    Pool:
      type: object
      required: [accounts, used_bytes, limit_bytes, free_bytes, picker_enabled]
      properties:
        picker_enabled:
          type: boolean
          description: Whether files can be added with Google's picker.
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/PoolAccount"
        used_bytes:
          type: integer
          format: int64
        limit_bytes:
          type: integer
          format: int64
          nullable: true
          description: Null if any working account has no limit.
        free_bytes:
          type: integer
          format: int64
          nullable: true
          description: Null if any working account has no limit.
    SearchResults:
      type: object
      required: [folders, files]
      properties:
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
    Settings:
      type: object
      required: [max_upload_bytes]
      properties:
        max_upload_bytes:
          type: integer
          format: int64
          description: The largest file anyone can upload.
    SettingsUpdate:
      type: object
      description: Only the fields present are changed.
      properties:
        max_upload_bytes:
          type: integer
          format: int64
    ManagedUser:
      type: object
      description: An account as the admin sees it. It says nothing about the person's files.
      required: [id, email, role, has_password, google_linked, must_change_password, linked_accounts, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
        has_password:
          type: boolean
        google_linked:
          type: boolean
        must_change_password:
          type: boolean
        linked_accounts:
          type: integer
          description: How many storage accounts this person has linked.
        created_at:
          type: string
          format: date-time
    NewPassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
    JobRun:
      type: object
      required: [name, finished_at, succeeded]
      properties:
        name:
          type: string
        finished_at:
          type: string
          format: date-time
        succeeded:
          type: boolean
    UnreachableAccount:
      type: object
      required: [owner_email, summary, checked_at]
      properties:
        owner_email:
          type: string
        summary:
          type: string
          description: The Google account that couldn't be reached.
        checked_at:
          type: string
          format: date-time
    ServerStatus:
      type: object
      required: [jobs, accounts, used_bytes, unreachable_accounts]
      properties:
        jobs:
          type: array
          description: Only jobs that have finished at least once.
          items:
            $ref: "#/components/schemas/JobRun"
        accounts:
          type: integer
          format: int64
          description: Storage accounts linked across the whole server.
        used_bytes:
          type: integer
          format: int64
          description: Space used across them, as of the last quota sync.
        unreachable_accounts:
          type: array
          items:
            $ref: "#/components/schemas/UnreachableAccount"
    AuditEvent:
      type: object
      required: [id, action, actor_email, ip, metadata, created_at]
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
        actor_email:
          type: string
          nullable: true
          description: Null for the command line, or if nobody could be identified.
        ip:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AuditPage:
      type: object
      required: [events, next_before]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_before:
          type: string
          nullable: true
          description: Pass this as `before` for the next page. Null on the last page.
    NewUpload:
      type: object
      required: [name, size]
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
        content_type:
          type: string
        folder_id:
          type: string
          format: uuid
          nullable: true
        connection_id:
          type: string
          format: uuid
          nullable: true
          description: The account to use. Left out, the account with the most free space is chosen.
        last_modified:
          type: integer
          format: int64
          description: >
            The file's modified time in milliseconds. After a reload the file has
            to be picked again, and this tells whether it's the same one.
    UploadSession:
      type: object
      required: [id, connection_id, folder_id, name, size, received, last_modified, created_at]
      properties:
        id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        folder_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        size:
          type: integer
          format: int64
        received:
          type: integer
          format: int64
          description: How much the storage account has kept.
        last_modified:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        file:
          $ref: "#/components/schemas/File"
    SyncResult:
      type: object
      required: [added, removed]
      properties:
        added:
          type: integer
        removed:
          type: integer
    PickerAccess:
      type: object
      required: [access_token, developer_key, app_id]
      properties:
        access_token:
          type: string
        developer_key:
          type: string
        app_id:
          type: string
    PickedFiles:
      type: object
      required: [file_ids]
      properties:
        file_ids:
          type: array
          items:
            type: string
    ImportResult:
      type: object
      required: [added, skipped]
      properties:
        added:
          type: integer
        skipped:
          type: integer
          description: Files that were already added, have no bytes to download, or are gone.
    Error:
      type: object
      description: Body of every error response.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
            message:
              type: string
              description: Safe, human-readable message.
            request_id:
              type: string
              description: Matches the X-Request-ID response header and the server logs.
