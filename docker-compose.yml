# Local development stack. Create .env first with `make env`.
# Ports are published on 127.0.0.1 only, so nothing is exposed to the network.
name: dextro

services:
  app:
    build: .
    environment:
      DEXTRO_DATABASE_URL: postgres://dextro:${POSTGRES_PASSWORD:?run make env to create .env}@postgres:5432/dextro?sslmode=disable
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dextro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env to create .env}
      POSTGRES_DB: dextro
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dextro -d dextro]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible server for developing and testing the s3 adapter.
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?run make env to create .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?run make env to create .env}
    ports:
      - 127.0.0.1:8333:8333
    volumes:
      - seaweedfs-data:/data

volumes:
  postgres-data:
  seaweedfs-data:
