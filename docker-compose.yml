# Local development stack. Create .env first with `make env`.
# Ports are published on 127.0.0.1 only, so nothing is exposed to the network.
name: dextro

services:
  # The address browsers use. Serves the UI and proxies the API to the api service.
  web:
    build:
      context: ./web
      args:
        VERSION: ${VERSION:-dev}
    environment:
      DEXTRO_API_URL: http://api:8080
      # Addresses of any proxy in front of this service, so its visitors' addresses are believed.
      DEXTRO_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - 127.0.0.1:3000:3000
    networks:
      default:
        # Fixed so the api service can trust X-Forwarded-For from this address alone.
        ipv4_address: 172.30.0.250
    depends_on:
      - api
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    environment:
      DEXTRO_DATABASE_URL: postgres://dextro:${POSTGRES_PASSWORD:?run make env to create .env}@postgres:5432/dextro?sslmode=disable
      DEXTRO_PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:3000}
      DEXTRO_TRUSTED_PROXIES: 172.30.0.250
      DEXTRO_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      DEXTRO_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEXTRO_GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
      DEXTRO_ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?run make env to add it to .env}
      DEXTRO_ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-}
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dextro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env to create .env}
      POSTGRES_DB: dextro
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dextro -d dextro]
      interval: 3s
      timeout: 3s
      retries: 20

  # Copies the database into ./backups once a day, and keeps the last week. It waits an hour
  # after starting, and names each copy to the minute, so a restart after losing the database
  # can't replace a good copy with an empty one.
  backup:
    image: postgres:18-alpine
    environment:
      PGHOST: postgres
      PGUSER: dextro
      PGDATABASE: dextro
      PGPASSWORD: ${POSTGRES_PASSWORD:?run make env to create .env}
    entrypoint: [/bin/sh, -c]
    command:
      - |
        sleep 3600
        while true; do
          if [ -z "$$(find /backups -name 'dextro-*.sql.gz' -mtime -1)" ]; then
            file=/backups/dextro-$$(date +%F-%H%M).sql
            pg_dump --file="$$file" && gzip "$$file" || rm -f "$$file"
          fi
          find /backups -name 'dextro-*.sql.gz' -mtime +7 -delete
          sleep 3600
        done
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
