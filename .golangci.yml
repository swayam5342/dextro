version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - sqlclosecheck
    - unconvert
  settings:
    errorlint:
      # Comparing a recovered panic value to http.ErrAbortHandler is the
      # documented pattern, not a wrapped-error mistake.
      comparison: false
  exclusions:
    generated: strict
    rules:
      # Tests use fixed fake credentials and data, and need no request context.
      - path: _test\.go
        linters:
          - gosec
          - noctx
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/swayam5342/dextro
