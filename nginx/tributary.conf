# HTTPS in front of the web service. Browsers only use HTTP/2 over HTTPS, and HTTP/2 is
# what lets more uploads run at once, because HTTP/1.1 gives a browser 6 connections.
server {
    listen 8443 ssl;
    http2 on;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/tributary.crt;
    ssl_certificate_key /etc/nginx/certs/tributary.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Uploads and downloads stream end to end, so nothing here may hold a whole file or
    # judge its size. The Go server enforces the limit while streaming.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    # A piece waits on Google and a zip can pause between files, so these are generous.
    client_body_timeout 10m;
    proxy_send_timeout 1h;
    proxy_read_timeout 1h;

    location / {
        proxy_pass http://172.30.0.250:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Replaced rather than added to, so a visitor can't supply their own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
